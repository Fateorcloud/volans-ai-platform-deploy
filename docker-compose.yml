name: ai-platform

networks:
  ai-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${AI_NET_SUBNET:-172.18.0.0/16}
          gateway: ${AI_NET_GATEWAY:-172.18.0.1}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-proxy-env: &proxy-env
  HTTP_PROXY: http://host.docker.internal:7890
  HTTPS_PROXY: http://host.docker.internal:7890
  NO_PROXY: localhost,127.0.0.1,.local,postgres,newapi,open-webui,playwright,172.16.0.0/12,10.0.0.0/8
  http_proxy: http://host.docker.internal:7890
  https_proxy: http://host.docker.internal:7890
  no_proxy: localhost,127.0.0.1,.local,postgres,newapi,open-webui,playwright,172.16.0.0/12,10.0.0.0/8

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-15.8-alpine}
    container_name: postgres
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      TZ: Asia/Shanghai
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    expose:
      - "5432"
    networks:
      - ai-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  newapi:
    image: calciumion/new-api:${NEWAPI_VERSION:-latest}
    container_name: newapi
    restart: always
    logging: *default-logging
    extra_hosts:
      - "host.docker.internal:${AI_NET_GATEWAY:-172.18.0.1}"
    environment:
      <<: *proxy-env
      SQL_DSN: postgresql://${DB_USER}:${DB_PASS}@postgres:5432/newapi_db
      TZ: Asia/Shanghai
      GODEBUG: http2client=0
    volumes:
      - ./newapi_data:/data
    expose:
      - "3000"
    networks:
      - ai-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/status >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPENWEBUI_VERSION:-main}
    container_name: open-webui
    restart: always
    logging: *default-logging
    extra_hosts:
      - "host.docker.internal:${AI_NET_GATEWAY:-172.18.0.1}"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASS}@postgres:5432/openwebui_db

      OPENAI_API_BASE_URL: http://newapi:3000/v1
      OPENAI_API_KEY: ${NEWAPI_MASTER_KEY}

      ENABLE_PERSISTENT_CONFIG: ${OPENWEBUI_ENABLE_PERSISTENT_CONFIG:-False}
      ENABLE_SIGNUP: ${OPENWEBUI_ENABLE_SIGNUP:-true}
      DEFAULT_USER_ROLE: ${OPENWEBUI_DEFAULT_USER_ROLE:-pending}
      ENABLE_SIGNUP_PASSWORD_CONFIRMATION: ${OPENWEBUI_ENABLE_SIGNUP_PASSWORD_CONFIRMATION:-true}
      ENABLE_DIRECT_CONNECTIONS: ${OPENWEBUI_ENABLE_DIRECT_CONNECTIONS:-false}
      ENABLE_API_KEYS: ${OPENWEBUI_ENABLE_API_KEYS:-false}
      USER_PERMISSIONS_FEATURES_API_KEYS: ${OPENWEBUI_USER_PERMISSIONS_FEATURES_API_KEYS:-false}
      BYPASS_MODEL_ACCESS_CONTROL: ${OPENWEBUI_BYPASS_MODEL_ACCESS_CONTROL:-false}
      PENDING_USER_OVERLAY_TITLE: ${OPENWEBUI_PENDING_USER_OVERLAY_TITLE:-Account pending review}
      PENDING_USER_OVERLAY_CONTENT: ${OPENWEBUI_PENDING_USER_OVERLAY_CONTENT:-Your account is waiting for administrator approval.}

      ENABLE_WEB_SEARCH: ${OPENWEBUI_ENABLE_WEB_SEARCH:-true}
      WEB_SEARCH_ENGINE: ${OPENWEBUI_WEB_SEARCH_ENGINE:-duckduckgo}
      BRAVE_SEARCH_API_KEY: ${OPENWEBUI_BRAVE_SEARCH_API_KEY:-}
      WEB_SEARCH_RESULT_COUNT: ${OPENWEBUI_WEB_SEARCH_RESULT_COUNT:-3}
      WEB_SEARCH_CONCURRENT_REQUESTS: ${OPENWEBUI_WEB_SEARCH_CONCURRENT_REQUESTS:-1}
      WEB_LOADER_ENGINE: ${OPENWEBUI_WEB_LOADER_ENGINE:-safe_web}
      WEB_LOADER_CONCURRENT_REQUESTS: ${OPENWEBUI_WEB_LOADER_CONCURRENT_REQUESTS:-3}
      BYPASS_WEB_SEARCH_WEB_LOADER: ${OPENWEBUI_BYPASS_WEB_SEARCH_WEB_LOADER:-false}
      BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL: ${OPENWEBUI_BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL:-false}
      USER_PERMISSIONS_FEATURES_WEB_SEARCH: ${OPENWEBUI_USER_PERMISSIONS_FEATURES_WEB_SEARCH:-true}
      PERSONAL_BROWSER_HEADLESS: "true"

      WEBUI_URL: ${WEBUI_URL}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      TZ: Asia/Shanghai
    volumes:
      - ./open-webui_data:/app/backend/data
    expose:
      - "8080"
    networks:
      - ai-net
    depends_on:
      postgres:
        condition: service_healthy
      newapi:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-latest}
    container_name: cloudflare-tunnel
    restart: always
    logging: *default-logging
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    networks:
      - ai-net
    depends_on:
      - open-webui
      - newapi

  # Optional Playwright sidecar for JS-heavy web pages.
  # Enable with:
  #   docker compose --profile browser up -d playwright
  playwright:
    image: browserless/chrome:${BROWSERLESS_VERSION:-latest}
    container_name: playwright
    restart: always
    profiles: ["browser"]
    logging: *default-logging
    environment:
      CONNECTION_TIMEOUT: 60000
      MAX_CONCURRENT_SESSIONS: 3
      <<: *proxy-env
    extra_hosts:
      - "host.docker.internal:${AI_NET_GATEWAY:-172.18.0.1}"
    networks:
      - ai-net
