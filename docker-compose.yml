name: ai-platform

networks:
  ai-net:
    driver: bridge

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-15.8-alpine}
    container_name: postgres
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      TZ: Asia/Shanghai
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ai-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G

  newapi:
    image: calciumion/new-api:${NEWAPI_VERSION:-latest}
    container_name: newapi
    restart: always
    logging: *default-logging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SQL_DSN: postgresql://${DB_USER}:${DB_PASS}@postgres:5432/newapi_db
      TZ: Asia/Shanghai
      HTTP_PROXY: http://host.docker.internal:7890
      HTTPS_PROXY: http://host.docker.internal:7890
      NO_PROXY: localhost,127.0.0.1,.local,postgres,newapi,open-webui,playwright,172.16.0.0/12,10.0.0.0/8
    volumes:
      - ./newapi_data:/data
    networks:
      - ai-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/status >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPENWEBUI_VERSION:-main}
    container_name: open-webui
    restart: always
    logging: *default-logging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASS}@postgres:5432/openwebui_db
      OPENAI_API_BASE_URL: http://newapi:3000/v1
      OPENAI_API_KEY: ${NEWAPI_MASTER_KEY}
      ENABLE_RAG_WEB_SEARCH: "True"
      RAG_WEB_SEARCH_ENGINE: duckduckgo
      RAG_EMBEDDING_ENGINE: openai
      RAG_OPENAI_API_BASE_URL: http://newapi:3000/v1
      RAG_OPENAI_API_KEY: ${NEWAPI_MASTER_KEY}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-3-large}
      RAG_RERANKING_MODEL: ${RAG_RERANKING_MODEL:-}
      # Built-in lightweight web fetcher; 4GB host stays comfortable.
      # Upgrade to playwright sidecar only if JS-heavy pages are needed.
      WEB_LOADER_ENGINE: ${WEB_LOADER_ENGINE:-safe_web}
      PLAYWRIGHT_WS_URL: ${PLAYWRIGHT_WS_URL:-}
      PERSONAL_BROWSER_HEADLESS: "true"
      HTTP_PROXY: http://host.docker.internal:7890
      HTTPS_PROXY: http://host.docker.internal:7890
      NO_PROXY: localhost,127.0.0.1,.local,postgres,newapi,open-webui,playwright,172.16.0.0/12,10.0.0.0/8
      TZ: Asia/Shanghai
    volumes:
      - ./open-webui_data:/app/backend/data
    networks:
      - ai-net
    depends_on:
      postgres:
        condition: service_healthy
      newapi:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 2G

  # Optional Playwright sidecar for rendering JS-heavy pages during RAG web crawl.
  # Enable with: docker compose --profile browser up -d
  # Then set WEB_LOADER_ENGINE=playwright and PLAYWRIGHT_WS_URL=ws://playwright:3000 in .env
  playwright:
    image: browserless/chrome:${BROWSERLESS_VERSION:-latest}
    container_name: playwright
    restart: always
    profiles: ["browser"]
    logging: *default-logging
    environment:
      CONNECTION_TIMEOUT: 60000
      MAX_CONCURRENT_SESSIONS: 3
      HTTP_PROXY: http://host.docker.internal:7890
      HTTPS_PROXY: http://host.docker.internal:7890
      NO_PROXY: localhost,127.0.0.1,.local,postgres,newapi,open-webui,playwright,172.16.0.0/12,10.0.0.0/8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-net
    deploy:
      resources:
        limits:
          memory: 1G

  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-latest}
    container_name: cloudflare-tunnel
    restart: always
    logging: *default-logging
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    networks:
      - ai-net
    depends_on:
      - open-webui
      - newapi
